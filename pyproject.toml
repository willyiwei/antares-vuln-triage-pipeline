[project]
name = "antares-vuln-triage-pipeline"
version = "0.1.0"
description = "AI-powered vulnerability triage pipeline integrating Cisco AnTAres with governance controls, SARIF reporting, and a web dashboard"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
antares-triage = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
